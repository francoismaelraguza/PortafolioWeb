version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # three y su binding de React deben subir juntos.
      three:
        patterns: ['three', '@types/three', '@react-three/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      herramientas:
        dependency-type: development
        exclude-patterns: ['@types/three', '@types/react', '@types/react-dom']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
